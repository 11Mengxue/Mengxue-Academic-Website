<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Urban heat and air-quality research visual</title>
  <desc id="desc">An abstract urban grid linking heat, particulate matter, ozone and urban morphology.</desc>
  <rect width="900" height="1100" fill="#081721"/>
  <g stroke="#193a42" stroke-width="2" opacity=".75">
    <path d="M0 190h900M0 380h900M0 570h900M0 760h900M0 950h900"/>
    <path d="M150 0v1100M330 0v1100M510 0v1100M690 0v1100"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M70 860C210 690 250 790 380 580S610 410 830 180" stroke="#58c8b7" stroke-width="18" opacity=".9"/>
    <path d="M60 270C220 180 320 420 470 350S710 250 845 430" stroke="#e38a64" stroke-width="14" opacity=".85"/>
    <path d="M80 980C260 860 410 930 540 760S720 650 840 710" stroke="#78aee8" stroke-width="10" opacity=".85"/>
  </g>
  <g fill="#f5f3ed">
    <circle cx="380" cy="580" r="18"/><circle cx="470" cy="350" r="18"/><circle cx="540" cy="760" r="18"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" fill="#f5f3ed">
    <text x="70" y="110" font-size="32" letter-spacing="5">URBAN CLIMATE</text>
    <text x="70" y="155" font-size="18" fill="#9bb5b0" letter-spacing="2">BEIJING · 2014—2024</text>
    <text x="70" y="1040" font-size="24">HEAT × PM₂.₅ × O₃ × MORPHOLOGY</text>
  </g>
</svg>
